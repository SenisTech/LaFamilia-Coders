 $('pClr').onclick=()=>{pts={a:null,b:null};opts=[];planSt='idle';planInter=false;planTok++;pin('a');pin('b');planLayer.clearLayers();renderBody()};
 $('pSwap').onclick=()=>{pts={a:pts.b,b:pts.a};pin('a');pin('b');if(pts.a&&pts.b)plan();else renderBody()};
 $('pNow').onclick=()=>{depT=null;if(pts.a&&pts.b)plan();else renderBody()};
 $('pTime').onchange=e=>{const v=e.target.value.split(':');depT=v.length==2?(+v[0])*3600+(+v[1])*60:null;if(pts.a&&pts.b)plan()};
 document.querySelectorAll('.opt').forEach(e=>e.onclick=ev=>{if(ev.target.closest('details'))return;showOpt(+e.dataset.o)})}

async function renderRoute(){
 form.ds=form.ds||cur;try{await ensure(form.ds)}catch(e){}
 const ds=DS[form.ds]||[],names=[...new Set(ds.map(r=>r.name))];
 if(!names.includes(form.name))form.name=names[0];
 const vars=ds.filter(r=>r.name===form.name),v=vars[form.dirIdx]||vars[0],st=v?v.stops:[];
 if(form.from>=st.length-1)form.from=0;if(form.to<=form.from)form.to=Math.min(form.from+1,st.length-1);
 const opt=(a,sel)=>a.map(([val,txt])=>`<option value="${val}"${val==sel?' selected':''}>${esc(txt)}</option>`).join('');
 const legHtml=legs.map((l,i)=>{const prev=legs[i-1];let walk='';
  if(prev){const d=Math.round(hav(prev.b.slice(1),l.a.slice(1)));walk=`<div class="mut">🚶 ${d} m ${t('walk')}</div>`}
  return walk+`<div class="card"><span class="b" style="background:${l.color}">${ico(((DS[l.ds]||[]).find(x=>x.id===l.id&&x.dir===l.dir)||{}).k)} ${esc(l.name)}</span> ${esc(l.a[0])} → ${esc(l.b[0])}
   <div class="mut">${esc(dsName(l.ds))} · ${esc(priceShort(l.ds))}</div><button class="go sec" data-del="${i}">✕</button></div>`}).join('')||`<p class="mut">${t('empty')}</p>`;
 const mRides=legs.map(l=>{const r=(DS[l.ds]||[]).find(x=>x.id===l.id&&x.dir===l.dir);return{ds:l.ds,metro:!!r&&r.k===1,name:l.name,from:l.a[0],to:l.b[0]}}),mf=fare(mRides);
 const totHtml=legs.length?`<div class="card">${t('total')}: <b>${esc(fareTxt(mf))}</b><button class="go" id="mBuy"${mf.known?'':' disabled'}>🎫 ${t('buy')}</button></div>`+[...new Set(legs.map(l=>l.ds))].map(srcHtml).join(''):'';
 $('body').innerHTML=planHtml()+`<details class="src" id="manD"${manOpen?' open':''}><summary>${t('manual')}</summary>`+legHtml+totHtml+`<div class="card"><b>${t('addleg')}</b>
  <label class="mut">${t('city')}</label><select class="f" id="fDs">${opt(index.map(c=>[c.id,c.name]),form.ds)}</select>
  <label class="mut">${t('line')}</label><select class="f" id="fLine">${opt(names.map(n=>[n,n]),form.name)}</select>
  <label class="mut">${t('dir')}</label><select class="f" id="fDir">${opt(vars.map((r,i)=>[i,t('to_')+' '+(r.stops[r.stops.length-1]||[''])[0]]),form.dirIdx)}</select>
  <label class="mut">${t('from')}</label><select class="f" id="fFrom">${opt(st.map((s,i)=>[i,s[0]]),form.from)}</select>
  <label class="mut">${t('to')}</label><select class="f" id="fTo">${opt(st.map((s,i)=>[i,s[0]]).filter(([i])=>i>form.from),form.to)}</select>
  <button class="go" id="fAdd">${t('add')}</button></div>
  <button class="go sec" id="fClr">${t('clear')}</button></details>`;
 bindPlan();if($('mBuy'))$('mBuy').onclick=()=>openPay(mRides);$('manD').ontoggle=e=>{manOpen=e.target.open};
 const re=(id,fn)=>$(id).onchange=e=>{fn(e.target.value);renderRoute()};
 re('fDs',x=>{form={ds:x,name:null,dirIdx:0,from:0,to:1}});re('fLine',x=>{form.name=x;form.dirIdx=0;form.from=0;form.to=1});
 re('fDir',x=>{form.dirIdx=+x;form.from=0;form.to=1});re('fFrom',x=>{form.from=+x});re('fTo',x=>{form.to=+x});
 $('fAdd').onclick=()=>{if(!v||form.to<=form.from)return;
  legs.push({ds:form.ds,name:v.name,color:COL[legs.length%COL.length],id:v.id,dir:v.dir,a:[st[form.from][0],st[form.from][1],st[form.from][2]],b:[st[form.to][0],st[form.to][1],st[form.to][2]]});
  save();drawRoute(true);renderRoute()};
 $('fClr').onclick=()=>{legs=[];save();drawRoute();renderRoute()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{legs.splice(+b.dataset.del,1);save();drawRoute();renderRoute()})}
function nearestIdx(line,p){let bi=0,bd=1e18;line.forEach((q,i)=>{const d=(q[0]-p[1])**2+(q[1]-p[2])**2;if(d<bd){bd=d;bi=i}});return bi}
function drawRoute(fit){routeLayer.clearLayers();const all=L.latLngBounds([]),S=[];
 legs.forEach((l,i)=>{const r=(DS[l.ds]||[]).find(x=>x.id===l.id&&x.dir===l.dir);let pp=[[l.a[1],l.a[2]],[l.b[1],l.b[2]]];
  if(r){const i1=nearestIdx(r.line,l.a),i2=nearestIdx(r.line,l.b);if(i1<i2)pp=r.line.slice(i1,i2+1)}
  S.push({p:pp,c:l.color,w:7,cw:4,o:.95});all.extend(pp);
  if(legs[i-1])L.polyline([[legs[i-1].b[1],legs[i-1].b[2]],[l.a[1],l.a[2]]],{color:'#7a8494',weight:3,dashArray:'4 8'}).addTo(routeLayer)});
 strokes(routeLayer,S);
 legs.forEach((l,i)=>[l.a,l.b].forEach((s,j)=>L.circleMarker([s[1],s[2]],{radius:7,color:l.color,weight:3,fillColor:'#fff',fillOpacity:1}).bindTooltip((j?'':(i+1)+'. ')+esc(s[0])).addTo(routeLayer)));
 if(fit&&all.isValid())map.fitBounds(all,{paddingBottomRight:[20,260],paddingTopLeft:[20,70]});syncLines()}

/* ---------- mock checkout + tickets (CONCEPT ONLY - see payments.js) ---------- */
function goTab(n){tab=n;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===n));renderBody();if(sheetState==0)sheet(1)}
const rideList=o=>o.legs.filter(l=>l.t==='ride').map(l=>({ds:l.ds,metro:l.k===1,name:l.name,from:l.from.n,to:l.to.n}));
function orderFromRides(rides){const by=fareBy(rides),items=[],unpriced=[];
 for(const ds in by){const b=by[ds],mine=rides.filter(r=>r.ds===ds);
  if(b.sum==null){unpriced.push({network:dsName(ds),lines:b.lines});continue}
  items.push({ds,network:dsName(ds),lines:b.lines,from:mine[0].from,to:mine[mine.length-1].to,n:b.n,unit:b.p.ride,total:b.sum,cur:b.p.cur,capped:!!b.p.cap&&b.n*b.p.ride>b.p.cap})}
 const o=Payments.order(items,items[0]&&items[0].cur);o.unpriced=unpriced;return o}
let pay=null;
function openPay(rides){const order=orderFromRides(rides);if(!order.items.length)return;
 pay={order,method:'card',step:'review',msg:'',card:{num:'',exp:'',cvc:'',name:''}};$('pay').classList.add('show');renderPay()}
function closePay(){$('pay').classList.remove('show');$('payBox').innerHTML='';pay=null;if(tab==='tickets')renderTickets()}
$('pay').onclick=e=>{if(e.target.id==='pay'&&pay&&pay.step!=='busy')closePay()};
const dt=x=>new Date(x).toLocaleString(undefined,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function tkHtml(k){const ok=Date.now()<k.validUntil;
 return `<div class="card tk${ok?'':' old'}"><div style="display:flex;gap:10px"><div class="qr">${Payments.qr(k.code)}</div><div style="min-width:0"><div class="hd">${esc(k.network)}</div>
  <div class="mut">${k.lines.map(esc).join(', ')}<br>${esc(k.from)} → ${esc(k.to)}</div><div>${k.n} ${t('rides')} · <b>${money(k.price,k.cur)}</b></div>
  <div class="mut">${ok?t('validT'):t('expiredT')} · ${t('validUntil')} ${dt(k.validUntil)}</div><div class="mut">${esc(k.id)} <span class="demo">DEMO</span></div></div></div></div>`}
function renderPay(){const p=pay,b=$('payBox'),o=p.order,head=`<div class="li"><b style="font-size:18px">${t('checkout')}</b><span class="demo">DEMO</span></div>`;
 if(p.step==='busy'){b.innerHTML=head+`<div class="spin"></div><p class="mut" style="text-align:center">${t('processing')}</p>`;return}
 if(p.step==='ok'){b.innerHTML=head+`<div class="big">✅</div><p style="text-align:center"><b>${t('paidOk')}</b> · ${money(o.total,o.cur)}</p>`+p.res.tickets.map(tkHtml).join('')
  +`<button class="go" id="pTk">${t('myTickets')}</button><button class="go sec" id="pDone">${t('done')}</button>`;
  $('pDone').onclick=closePay;$('pTk').onclick=()=>{closePay();goTab('tickets')};return}
 if(p.step==='err'){b.innerHTML=head+`<div class="big">❌</div><p style="text-align:center"><b>${esc(p.msg)}</b></p><button class="go" id="pRetry">${t('tryAgain')}</button><button class="go sec" id="pX">${t('cancel')}</button>`;
  $('pRetry').onclick=()=>{p.step='review';p.msg='';renderPay()};$('pX').onclick=closePay;return}
 const items=o.items.map(i=>`<div class="card"><div class="li"><span>${esc(i.network)} · ${i.n}× ${t('ticket')}</span><b>${money(i.total,i.cur)}</b></div><div class="mut">${i.lines.map(esc).join(', ')} · ${esc(i.from)} → ${esc(i.to)}${i.capped?' · '+t('capApplied'):''}</div></div>`).join('');
 const un=o.unpriced.length?`<p class="mut">⚠ ${t('unpricedNote')}: ${o.unpriced.map(u=>esc(u.network)).join(', ')}</p>`:'';
 const M=[['card','💳',t('mCard')],['pay','📱',t('mPay')],['wallet','👛',t('mWallet')+' ('+money(Payments.wallet.get())+')']];
 const card=p.method==='card'?`<input class="f" id="cNum" inputmode="numeric" autocomplete="off" placeholder="${t('cardNo')}" value="${esc(p.card.num)}">
  <div style="display:flex;gap:6px"><input class="f" id="cExp" inputmode="numeric" autocomplete="off" placeholder="MM/YY" value="${esc(p.card.exp)}"><input class="f" id="cCvc" inputmode="numeric" autocomplete="off" placeholder="CVC" maxlength="4" value="${esc(p.card.cvc)}"></div>
  <input class="f" id="cName" autocomplete="off" placeholder="${t('holder')}" value="${esc(p.card.name)}"><p class="mut">${t('testHint')}</p>`:'';
 b.innerHTML=head+`<p class="mut">${t('demoBanner')}</p>`+items+un+`<div class="li"><b>${t('total')}</b><b style="font-size:18px">${money(o.total,o.cur)}</b></div>`
  +M.map(([k,i,x])=>`<div class="pm${p.method===k?' sel':''}" data-m="${k}"><span>${i}</span><span>${x}</span></div>`).join('')+card
  +(p.msg?`<p style="color:#d93025">${esc(p.msg)}</p>`:'')+`<button class="go" id="pGo">${t('payBtn')} ${money(o.total,o.cur)}</button><button class="go sec" id="pX">${t('cancel')}</button>`;
 b.querySelectorAll('.pm').forEach(e=>e.onclick=()=>{p.method=e.dataset.m;p.msg='';renderPay()});
 $('pX').onclick=closePay;$('pGo').onclick=doPay;
 if(p.method==='card'){const bind=(id,k,fmt)=>{$(id).oninput=e=>{let v=e.target.value;if(fmt){v=fmt(v);e.target.value=v}p.card[k]=v};};
  bind('cNum','num',v=>v.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim());bind('cExp','exp',v=>{v=v.replace(/\D/g,'').slice(0,4);return v.length>2?v.slice(0,2)+'/'+v.slice(2):v});
  bind('cCvc','cvc',v=>v.replace(/\D/g,'').slice(0,4));bind('cName','name')}}
async function doPay(){const p=pay,c=p.card;
 if(p.method==='card'){const mm=+c.exp.slice(0,2);if(c.num.replace(/\D/g,'').length!==16||!/^\d\d\/\d\d$/.test(c.exp)||mm<1||mm>12||c.cvc.length<3){p.msg=t('badCard');return renderPay()}}
 p.step='busy';renderPay();
 try{p.res=await Payments.pay(p.order,p.method,{number:c.num});p.card={num:'',exp:'',cvc:'',name:''};p.step='ok'}
 catch(e){p.step='err';p.msg=e.code==='insufficient'?t('insufficient'):e.code==='declined'?t('declinedMsg'):t('badCard')}
 if(pay===p)renderPay()}
function renderTickets(){const l=Payments.tickets.list();
 $('body').innerHTML=`<div class="card"><div class="li"><span>👛 ${t('mWallet')} <span class="demo">DEMO</span></span><b>${money(Payments.wallet.get())}</b></div><button class="go sec" id="wTop">${t('topup')}</button></div>`
  +(l.map(tkHtml).join('')||`<p class="mut">${t('noTickets')}</p>`)+(l.length?`<button class="go sec" id="tClr">${t('clearTickets')}</button>`:'');
 $('wTop').onclick=()=>{Payments.wallet.topup(10);renderTickets()};const c=$('tClr');if(c)c.onclick=()=>{Payments.tickets.clear();renderTickets()}}
init();
</script></body></html>
